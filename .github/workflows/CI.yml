name: CI–FastAPI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

      
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety
      - name: Check dependency security
        run: safety check --bare || true

  test:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov httpx anyio
      - name: Run tests with coverage
        run: pytest --cov=app tests/
        env:
          PYTHONPATH: .